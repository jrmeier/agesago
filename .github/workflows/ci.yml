name: CI / Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

# Only one deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Repository pushes and manual runs use the self-hosted runner on forge (label "forge").
# Pull requests stay on GitHub-hosted runners: this repository is public, so a fork's
# pull request must never run code on our own machine.
jobs:
  build:
    # Same-repository PRs already get a build and smoke gate from their branch push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","forge"]') }}
    steps:
      # forge's /tmp is a small RAM-backed tmpfs; keep Vite, Vitest and Playwright scratch
      # files in the runner's on-disk temp directory instead (also fine on hosted runners).
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # Bound concurrent simulation suites to avoid worker RPC timeouts under runner load:
      # 2 on a hosted runner, 6 (a quarter of the cores) on forge, which also runs agents.
      - run: npm test -- --maxWorkers=${{ runner.environment == 'github-hosted' && '2' || '6' }}
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Fast gate for every branch: real Chromium (software WebGL), desktop + phone.
  e2e-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","forge"]') }}
    timeout-minutes: 10
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Read Playwright version
        id: playwright-version
        run: node -p "'version=' + require('./package-lock.json').packages['node_modules/@playwright/test'].version" >> "$GITHUB_OUTPUT"
      # Hosted runners start empty, so cache Chromium. forge keeps its own copy in the runner
      # account's ~/.cache; `playwright install` below is then a quick no-op.
      - uses: actions/cache@v4
        id: playwright-cache
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-playwright-${{ steps.playwright-version.outputs.version }}
      # forge already has the system libraries and has no passwordless apt.
      - run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: runner.environment == 'github-hosted' && steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npx playwright test --grep @smoke
        env:
          PW_WORKERS: ${{ runner.environment == 'github-hosted' && '1' || '3' }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: test-results
          retention-days: 7

  # Full coverage on main/manual runs and ALL PRs, including same-repository PRs:
  # feature-branch pushes only run smoke, so skipping these PRs would lose coverage.
  e2e:
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","forge"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One unsharded run on forge; eight concurrent single-worker shards on hosted PR runners.
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1,2,3,4,5,6,7,8]' || '[1]') }}
    steps:
      # forge's /tmp is a small RAM-backed tmpfs; keep Vite, Vitest and Playwright scratch
      # files in the runner's on-disk temp directory instead (also fine on hosted runners).
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Read Playwright version
        id: playwright-version
        run: node -p "'version=' + require('./package-lock.json').packages['node_modules/@playwright/test'].version" >> "$GITHUB_OUTPUT"
      # Hosted runners start empty, so cache Chromium. forge keeps its own copy in the runner
      # account's ~/.cache; `playwright install` below is then a quick no-op.
      - uses: actions/cache@v4
        id: playwright-cache
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-playwright-${{ steps.playwright-version.outputs.version }}
      # Hosted runners need the system libraries even when Chromium is cached.
      - run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: runner.environment == 'github-hosted' && steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Full suite on forge
        if: github.event_name != 'pull_request'
        run: npx playwright test --grep-invert @smoke
        env:
          # 3, not 6: forge is shared with coding agents, and at 6 workers SwiftShader frames
          # starved under load (run 44847588967: 3 failed, 7 flaky, all frame-driven timeouts).
          PW_WORKERS: 3
      - name: Full suite shard on hosted runner
        if: github.event_name == 'pull_request'
        run: npx playwright test --grep-invert @smoke --shard=${{ matrix.shard }}/8
        env:
          PW_WORKERS: 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # Ships dist/ to agesago.jedm.dev on the jedm droplet. The deploy key is restricted
  # server-side to `rrsync -wo /var/www/agesago.jedm.dev`, so "/" below is the web root.
  deploy:
    needs: [build, e2e-smoke, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, forge]
    environment:
      name: production
      url: https://agesago.jedm.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Keep the key and host list in the per-job temp directory, never in the runner
      # user's own ~/.ssh (on forge that is a real account).
      - name: Install deploy key
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$RUNNER_TEMP/ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key"
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Sync to droplet
        run: >
          rsync -rlz --delete-after --delay-updates
          -e "ssh -i $RUNNER_TEMP/ssh/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o IdentitiesOnly=yes -o BatchMode=yes"
          dist/ jedmeier@157.245.7.84:/

      - name: Remove deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/ssh/deploy_key"

      - name: Smoke test
        run: curl -fsS https://agesago.jedm.dev/ | grep -q '<title>Ages Ago</title>'
