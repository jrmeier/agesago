          <div class="hud-hint">
            <kbd>LMB</kbd> select / drag-box &nbsp;·&nbsp; <kbd>A</kbd> all &nbsp;·&nbsp;
            <kbd>RMB</kbd> move / gather / build &nbsp;·&nbsp; <kbd>Scroll</kbd> zoom &nbsp;·&nbsp;
            <kbd>T</kbd> train &nbsp;·&nbsp; <kbd>E</kbd> explore &nbsp;·&nbsp; <kbd>.</kbd> scout &nbsp;·&nbsp;
            <kbd>F</kbd> first-person
          </div>
        </header>
        <footer class="hud-bottom">
          <div id="selection-panel" class="selection-panel hidden" data-hud-interactive>
            <div class="unit-portrait" data-count="">
              <svg aria-hidden="true"><use href="#i-villager" /></svg>
            </div>
            <div class="unit-info">
              <h3 id="unit-name">Villager</h3>
              <p id="unit-status">Idle</p>
              <div id="build-progress" class="build-progress" hidden><div class="build-progress-fill"></div></div>
            </div>
            <button id="explore-btn" class="explore-btn" type="button" aria-pressed="false" title="Explore (E)" hidden>
              <svg class="eicon" aria-hidden="true"><use href="#i-compass" /></svg><span>Explore</span><kbd>E</kbd>
            </button>
            <button id="cancel-build-btn" class="explore-btn cancel-build-btn" type="button" title="Cancel the foundation (refunds its cost)" hidden>
              <svg class="eicon" aria-hidden="true"><use href="#i-none" /></svg><span>Cancel</span>
            </button>
            <div id="build-grid" class="build-grid" role="group" aria-label="Build" hidden></div>
          </div>
          <div id="place-bar" class="place-bar" data-hud-interactive hidden>
            <div class="place-text">
              <b id="place-name">House</b>
              <span id="place-reason" class="place-reason"></span>
              <span class="place-help place-help-mouse"><kbd>LMB</kbd> place · <kbd>Shift</kbd> more · <kbd>R</kbd> rotate · <kbd>Esc</kbd> cancel</span>
              <span class="place-help place-help-touch">Drag the outline, then ✓</span>
            </div>
            <button id="place-rotate" class="place-btn" type="button" aria-label="Rotate" title="Rotate (R / Shift+wheel)">⟳</button>
            <button id="place-cancel" class="place-btn place-btn-cancel" type="button" aria-label="Cancel" title="Cancel (Esc / RMB)">✕</button>
            <button id="place-confirm" class="place-btn place-btn-ok" type="button" aria-label="Place here" title="Place">✓</button>
          </div>
          <div class="touch-bar">
            <button id="touch-select-all" class="touch-btn rts-only" aria-label="Select all villagers">
              <svg class="ticon" aria-hidden="true"><use href="#i-all" /></svg><span>All</span>
            </button>
            <button id="touch-deselect" class="touch-btn rts-only" aria-label="Deselect">
              <svg class="ticon" aria-hidden="true"><use href="#i-none" /></svg><span>None</span>
            </button>
            <button id="touch-fps" class="touch-btn" aria-label="Toggle first-person view" aria-pressed="false">
              <svg class="ticon" aria-hidden="true"><use href="#i-eye" /></svg><span>View</span>
            </button>
          </div>
          <button id="train-btn" class="train-btn">
            <span class="train-badge" aria-hidden="true">
              <svg class="train-icon"><use href="#i-villager" /></svg>
              <svg class="train-ring" viewBox="0 0 40 40">
                <circle class="train-ring-track" cx="20" cy="20" r="18" pathLength="100" />
                <circle class="train-ring-fill" cx="20" cy="20" r="18" pathLength="100" />
              </svg>
            </span>
            <span class="train-text">
              <b class="train-title">Train Villager</b>
              <span class="train-sub">50 food · T</span>
            </span>
          </button>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
