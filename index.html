<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2b1a0f" />
    <title>Ages Ago</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Alegreya+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Icon sprite: referenced with <svg><use href="#i-…"/></svg>. -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="g-bronze" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f6d98f" />
          <stop offset=".45" stop-color="#c8913a" />
          <stop offset="1" stop-color="#7a4f1a" />
        </linearGradient>
        <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff0a8" />
          <stop offset=".5" stop-color="#f0c23c" />
          <stop offset="1" stop-color="#a8740f" />
        </linearGradient>
        <linearGradient id="g-wheat" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f8dc84" />
          <stop offset="1" stop-color="#c9922e" />
        </linearGradient>
        <linearGradient id="g-bark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a8713c" />
          <stop offset="1" stop-color="#5c3816" />
        </linearGradient>
        <radialGradient id="g-sky" cx=".5" cy=".35" r=".75">
          <stop offset="0" stop-color="#f3dfb0" />
          <stop offset="1" stop-color="#b98b4e" />
        </radialGradient>
      </defs>

      <symbol id="i-food" viewBox="0 0 24 24">
        <g fill="none" stroke="#6b4612" stroke-width="1.1" stroke-linecap="round">
          <path d="M12 22.5V8M12 22.5 7.2 10.5M12 22.5l4.8-12" />
        </g>
        <g fill="url(#g-wheat)" stroke="#6b4612" stroke-width=".8">
          <ellipse cx="12" cy="3.6" rx="1.5" ry="2.4" />
          <ellipse cx="10.4" cy="6.6" rx="1.3" ry="2.1" transform="rotate(-28 10.4 6.6)" />
          <ellipse cx="13.6" cy="6.6" rx="1.3" ry="2.1" transform="rotate(28 13.6 6.6)" />
          <ellipse cx="6.4" cy="6.8" rx="1.3" ry="2.2" transform="rotate(-22 6.4 6.8)" />
          <ellipse cx="5.4" cy="9.6" rx="1.2" ry="1.9" transform="rotate(-48 5.4 9.6)" />
          <ellipse cx="8.4" cy="9.2" rx="1.2" ry="1.9" transform="rotate(10 8.4 9.2)" />
          <ellipse cx="17.6" cy="6.8" rx="1.3" ry="2.2" transform="rotate(22 17.6 6.8)" />
          <ellipse cx="18.6" cy="9.6" rx="1.2" ry="1.9" transform="rotate(48 18.6 9.6)" />
          <ellipse cx="15.6" cy="9.2" rx="1.2" ry="1.9" transform="rotate(-10 15.6 9.2)" />
        </g>
        <rect x="8.6" y="15.2" width="6.8" height="2.4" rx=".8" fill="#b0402a" stroke="#4d1a0e" stroke-width=".7" />
      </symbol>

      <symbol id="i-wood" viewBox="0 0 24 24">
        <path d="M6 7.5h12.5a4.2 5.2 0 0 1 0 10.4H6z" fill="url(#g-bark)" stroke="#3b230d" stroke-width=".9" />
        <path d="M9 10.2h7.5M10.5 15.2h6.8" stroke="#3b230d" stroke-width=".7" stroke-linecap="round" opacity=".7" />
        <ellipse cx="6" cy="12.7" rx="4.2" ry="5.2" fill="#e6bb7d" stroke="#3b230d" stroke-width=".9" />
        <ellipse cx="6" cy="12.7" rx="2.6" ry="3.3" fill="none" stroke="#a46c35" stroke-width=".7" />
        <ellipse cx="6" cy="12.7" rx="1.1" ry="1.4" fill="none" stroke="#a46c35" stroke-width=".7" />
        <path d="M14 7.5 15.6 4.4l1.6.8L16.2 7.5" fill="url(#g-bark)" stroke="#3b230d" stroke-width=".8" />
      </symbol>

      <symbol id="i-gold" viewBox="0 0 24 24">
        <circle cx="14.6" cy="9.4" r="7.2" fill="#b98318" stroke="#5e3f06" stroke-width=".9" />
        <circle cx="10" cy="14" r="8" fill="url(#g-gold)" stroke="#5e3f06" stroke-width="1" />
        <circle cx="10" cy="14" r="5.6" fill="none" stroke="#8a5e0a" stroke-width=".8" />
        <path d="M7.4 16.6 10 10.4l2.6 6.2M8.4 14.6h3.2" fill="none" stroke="#7a5208" stroke-width="1.1" stroke-linejoin="round" />
        <path d="M5 11.2a6 6 0 0 1 3.4-3" stroke="#fffbe0" stroke-width="1" fill="none" stroke-linecap="round" opacity=".8" />
      </symbol>

      <symbol id="i-pop" viewBox="0 0 24 24">
        <path d="M4.6 8.4C6 2.6 18 2.6 19.4 8.4c-2.4-2.4-12.4-2.4-14.8 0z" fill="#b8362a" stroke="#4d140c" stroke-width=".8" />
        <path
          d="M6.2 11.6c0-4 2.6-6 5.8-6s5.8 2 5.8 6v6.6l-2.9 2.6-.4-6.1-1.8-1.6v7.4h-1.4v-7.4l-1.8 1.6-.4 6.1-2.9-2.6z"
          fill="url(#g-bronze)"
          stroke="#4a2f0c"
          stroke-width=".9"
          stroke-linejoin="round"
        />
        <path d="M7.8 11.2c1.4-.5 2.6-.3 3.4.6l-.4 1.6-1.6 1.4-1.4-.4zM16.2 11.2c-1.4-.5-2.6-.3-3.4.6l.4 1.6 1.6 1.4 1.4-.4z" fill="#2a1a08" />
      </symbol>

      <symbol id="i-villager" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="23" fill="url(#g-sky)" />
        <path d="M6 48c0-11 7.6-16.4 18-16.4S42 37 42 48z" fill="#9c4a26" stroke="#4a1e0c" stroke-width="1.2" />
        <path d="M13 38.5c4 2.8 7.4 4 11 4s7-1.2 11-4" fill="none" stroke="#d8b86a" stroke-width="1.4" />
        <path d="M30 34.5 37.5 46" stroke="#e6dcc0" stroke-width="3.4" />
        <circle cx="30.4" cy="35" r="2.2" fill="url(#g-bronze)" stroke="#4a2f0c" stroke-width=".8" />
        <rect x="20.5" y="27" width="7" height="6" fill="#d9a678" />
        <circle cx="24" cy="20.5" r="8.6" fill="#e8bd92" stroke="#7a4a26" stroke-width="1" />
        <path d="M15.2 20c-.4-7 3.4-10.4 8.8-10.4s9.2 3.4 8.8 10.4c-1.4-3.4-4-5.4-8.8-5.4s-7.4 2-8.8 5.4z" fill="#5b3a1c" />
        <path d="M15.6 16.8c4.6-2.4 12.2-2.4 16.8 0" stroke="#e8d9b0" stroke-width="1.6" fill="none" />
        <path d="M16 22.4c.6 6.6 3.6 8.8 8 8.8s7.4-2.2 8-8.8c-1.6 2.6-4 3.4-8 3.4s-6.4-.8-8-3.4z" fill="#5b3a1c" />
        <circle cx="20.8" cy="20.6" r="1.1" fill="#2a1a0c" />
        <circle cx="27.2" cy="20.6" r="1.1" fill="#2a1a0c" />
      </symbol>

      <symbol id="i-shield" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.6" fill="url(#g-bronze)" stroke="#3d2509" stroke-width="1" />
        <circle cx="12" cy="12" r="8.2" fill="#9b2f22" stroke="#e8c070" stroke-width="1" />
        <path d="M8 16.5 12 7l4 9.5" fill="none" stroke="#f3dfa6" stroke-width="1.8" stroke-linejoin="round" />
      </symbol>

      <symbol id="i-all" viewBox="0 0 24 24">
        <g fill="currentColor">
          <circle cx="7" cy="8.4" r="2.6" />
          <circle cx="17" cy="8.4" r="2.6" />
          <path d="M2.6 19c0-4 2-6 4.4-6s4.4 2 4.4 6zM12.6 19c0-4 2-6 4.4-6s4.4 2 4.4 6z" />
          <circle cx="12" cy="6.6" r="3" />
          <path d="M7 20.5c0-5 2.2-7.6 5-7.6s5 2.6 5 7.6z" stroke="#2b1a0f" stroke-width="1" />
        </g>
      </symbol>

      <symbol id="i-none" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
      </symbol>

      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M1.8 12C4.6 7 8 4.8 12 4.8S19.4 7 22.2 12C19.4 17 16 19.2 12 19.2S4.6 17 1.8 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <circle cx="12" cy="12" r="3.6" fill="currentColor" />
      </symbol>

      <symbol id="i-map" viewBox="0 0 24 24">
        <path d="M3 5.5 8.5 3.5l7 2 5.5-2v15l-5.5 2-7-2-5.5 2z" fill="#e6d3a6" stroke="#4a2f0c" stroke-width="1.1" stroke-linejoin="round" />
        <path d="M8.5 3.5v15M15.5 5.5v15" stroke="#4a2f0c" stroke-width=".9" />
        <path d="M4.6 13c2-1.6 3.2.6 5.4-1s3.6.4 5.4-.6 2.4-1.8 4-1" stroke="#3f7fa0" stroke-width="1.2" fill="none" />
        <circle cx="12" cy="8.6" r="1.2" fill="#b0402a" />
      </symbol>
    </svg>

    <div id="app">
      <div id="game-container"></div>
      <div id="hud">
        <header class="hud-top">
          <div class="logo">
            <svg class="logo-icon" aria-hidden="true"><use href="#i-shield" /></svg>
            <span class="logo-text">Ages Ago</span>
          </div>
          <div class="resource-bar">
            <div class="res" title="Food">
              <svg class="ricon" aria-hidden="true"><use href="#i-food" /></svg><span id="res-food">0</span>
            </div>
            <div class="res" title="Wood">
              <svg class="ricon" aria-hidden="true"><use href="#i-wood" /></svg><span id="res-wood">0</span>
            </div>
            <div class="res" title="Gold">
              <svg class="ricon" aria-hidden="true"><use href="#i-gold" /></svg><span id="res-gold">0</span>
            </div>
            <div class="res" title="Villagers">
              <svg class="ricon" aria-hidden="true"><use href="#i-pop" /></svg><span id="res-pop">0</span>
            </div>
          </div>
          <div class="hud-hint">
            <kbd>LMB</kbd> select / drag-box &nbsp;·&nbsp; <kbd>A</kbd> all &nbsp;·&nbsp;
            <kbd>RMB</kbd> move / gather &nbsp;·&nbsp; <kbd>Scroll</kbd> zoom &nbsp;·&nbsp;
            <kbd>T</kbd> train &nbsp;·&nbsp; <kbd>F</kbd> first-person
          </div>
        </header>
        <footer class="hud-bottom">
          <div id="selection-panel" class="selection-panel hidden">
            <div class="unit-portrait" data-count="">
              <svg aria-hidden="true"><use href="#i-villager" /></svg>
            </div>
            <div class="unit-info">
              <h3 id="unit-name">Villager</h3>
              <p id="unit-status">Idle</p>
            </div>
          </div>
          <div class="touch-bar">
            <button id="touch-select-all" class="touch-btn rts-only" aria-label="Select all villagers">
              <svg class="ticon" aria-hidden="true"><use href="#i-all" /></svg><span>All</span>
            </button>
            <button id="touch-deselect" class="touch-btn rts-only" aria-label="Deselect">
              <svg class="ticon" aria-hidden="true"><use href="#i-none" /></svg><span>None</span>
            </button>
            <button id="touch-fps" class="touch-btn" aria-label="Toggle first-person view" aria-pressed="false">
              <svg class="ticon" aria-hidden="true"><use href="#i-eye" /></svg><span>View</span>
            </button>
          </div>
          <button id="train-btn" class="train-btn">
            <span class="train-badge" aria-hidden="true">
              <svg class="train-icon"><use href="#i-villager" /></svg>
              <svg class="train-ring" viewBox="0 0 40 40">
                <circle class="train-ring-track" cx="20" cy="20" r="18" pathLength="100" />
                <circle class="train-ring-fill" cx="20" cy="20" r="18" pathLength="100" />
              </svg>
            </span>
            <span class="train-text">
              <b class="train-title">Train Villager</b>
              <span class="train-sub">50 food · T</span>
            </span>
          </button>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
